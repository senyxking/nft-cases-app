<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <title>NFT-кейсы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#111318;--panel:#1b1e25;--panel2:#232732;--text:#f5f6fa;--muted:#9da4b3;--accent:#7c5cff;--line:#303541;--gold:#ffd66b;--safe-bottom:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:calc(76px + var(--safe-bottom))}button{font:inherit;color:inherit;border:0;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.app{width:min(100%,720px);margin:auto;padding:14px 14px 20px}.header{display:flex;align-items:center;gap:10px;min-width:0;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:16px}.user{display:flex;align-items:center;gap:9px;min-width:0;flex:1}.avatar{width:36px;height:36px;flex:0 0 36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#795bff,#44c7d9);font-weight:800}.username{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650}.header-actions{display:flex;align-items:center;gap:7px;flex:0 0 auto;white-space:nowrap}.balance{background:var(--panel2);padding:8px 10px;border-radius:12px;font-weight:700}.topup{background:#353044;color:#ded4ff;padding:9px 11px;border-radius:12px;font-weight:700}.heading{margin:22px 2px 12px;font-size:22px}.cases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.case{padding:12px 9px;background:var(--panel);border:1px solid var(--line);border-radius:16px;text-align:center;min-width:0}.case-icon{font-size:34px;margin:2px 0 5px}.case-name{font-weight:750;font-size:14px}.case-price{color:var(--gold);font-weight:700;margin:4px 0 10px}.open-btn,.primary{width:100%;background:var(--accent);padding:10px 7px;border-radius:11px;font-weight:750;font-size:13px}.section-title{margin:22px 2px 10px;font-size:18px}.roulette-wrap{overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 0;position:relative}.roulette{display:flex;gap:9px;width:max-content;transform:translateX(0);will-change:transform;padding:0 12px}.prize{width:92px;height:100px;flex:0 0 92px;border:1px solid #393f4e;border-radius:13px;background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.prize-icon{font-size:32px}.prize-name{font-size:11px;color:#c7ccda;padding:0 4px}.pointer{position:absolute;z-index:2;left:50%;top:0;bottom:0;width:2px;background:var(--gold);box-shadow:0 0 12px #ffd66b}.pointer:before{content:"";position:absolute;top:0;left:-5px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid var(--gold)}.notice{margin-top:12px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:#ffcfcc;display:none}.inventory-list{display:grid;gap:10px}.gift-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.gift-row .gift-icon{font-size:30px}.gift-info{flex:1;min-width:0}.gift-info strong,.gift-info span{display:block}.gift-info span{font-size:12px;color:var(--muted)}.withdraw{background:#343044;padding:9px 11px;border-radius:10px;font-weight:700}.empty{color:var(--muted);text-align:center;padding:28px 10px;background:var(--panel);border-radius:14px}.screen[hidden]{display:none}.tabs{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:8px 12px calc(8px + var(--safe-bottom));background:rgba(20,22,28,.96);border-top:1px solid var(--line);display:flex;justify-content:center;gap:10px;backdrop-filter:blur(12px)}.tab{flex:1;max-width:340px;padding:11px;border-radius:12px;background:transparent;color:var(--muted);font-weight:700}.tab.active{background:var(--panel2);color:var(--text)}.modal-backdrop{position:fixed;z-index:10;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;padding:16px}.modal-backdrop.show{display:flex}.modal{width:min(100%,500px);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:19px}.modal h2{margin:0 0 7px;font-size:20px}.modal p{color:var(--muted);margin:0 0 16px}.modal-actions{display:grid;gap:9px}.gift-link{display:block;text-align:center;background:var(--accent);color:white;text-decoration:none;padding:12px;border-radius:12px;font-weight:750}.secondary{background:var(--panel2);padding:12px;border-radius:12px;font-weight:700}.close{float:right;background:transparent;color:var(--muted);font-size:22px;padding:0 4px}@media(max-width:370px){.app{padding-left:10px;padding-right:10px}.header{gap:6px;padding:8px}.header-actions{gap:5px}.balance,.topup{padding:8px 7px;font-size:12px}.cases{gap:6px}.case{padding:10px 5px}.case-name{font-size:12px}.open-btn{font-size:11px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="user"><div class="avatar" id="avatar">?</div><div class="username" id="username">Гость</div></div>
<div class="header-actions"><div class="balance">⭐ <span id="balance">0</span></div><button class="topup" id="topupBtn" type="button" onclick="const m=document.getElementById('topupModal'); m.style.display='flex'; m.classList.add('open');">+ Пополнить</button></div>

    </header>
    <section class="screen" id="casesScreen">
      <h1 class="heading">Открывай кейсы</h1>
      <div class="cases" id="cases"></div>
      <h2 class="section-title">Рулетка призов</h2>
      <div class="roulette-wrap"><div class="pointer"></div><div class="roulette" id="roulette"></div></div>
      <div class="notice" id="notice" role="status"></div>
    </section>
    <section class="screen" id="inventoryScreen" hidden>
      <h1 class="heading">Инвентарь</h1>
      <div class="inventory-list" id="inventoryList"></div>
    </section>
  </main>
  <nav class="tabs" aria-label="Разделы"><button class="tab active" id="casesTab" type="button">🎁 Кейсы</button><button class="tab" id="inventoryTab" type="button">💎 Инвентарь</button></nav>
  <div class="modal-backdrop" id="topupModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><button class="close" id="closeModal" aria-label="Закрыть">×</button><h2 id="modalTitle">Пополнение баланса</h2><p>Отправьте подарок, затем обновите баланс.</p><div class="modal-actions"><a class="gift-link" id="sendGift" href="https://t.me/ownertonov">Отправить подарок</a><button class="secondary" id="refreshBalance" type="button">Обновить баланс</button></div></div></div>
<script>
const API_BASE_URL = 'https://1cs7mmior8.apps.bot-hosting.cloud';
const STORAGE_URL = 'https://t.me/ownertonov';

(() => {
  'use strict';
  const tg = window.Telegram && window.Telegram.WebApp;
  const cases = [
    {id:'starter',name:'Стартовый',price:100,icon:'🎁'},
    {id:'rare',name:'Редкий',price:350,icon:'💎'},
    {id:'mythic',name:'Мифический',price:1000,icon:'🌟'}
  ];
  const defaultPrizes = [
    {name:'Плюшевый мишка',icon:'🧸'},{name:'Цветок',icon:'🌹'},{name:'Звезда',icon:'⭐'},
    {name:'Подвеска',icon:'💝'},{name:'Кристалл',icon:'💎'},{name:'Подарок',icon:'🎁'},
    {name:'Трофей',icon:'🏆'},{name:'Лунный кот',icon:'🐱'}
  ];
  const $ = id => document.getElementById(id);
  const state = {inventory:[], busy:false, balance:0};
  const auth = () => tg && tg.initData ? tg.initData : '';

  // Сначала строим весь интерфейс из локальных данных — сеть не блокирует первый экран.
  function renderCases(){
    $('cases').innerHTML = cases.map(c => `<article class="case"><div class="case-icon">${c.icon}</div><div class="case-name">${c.name}</div><div class="case-price">${c.price} ⭐</div><button class="open-btn" data-case="${c.id}" type="button">Открыть кейс</button></article>`).join('');
  }
  function renderRoulette(prizes=defaultPrizes){
    const items = [...prizes,...prizes,...prizes,...prizes];
    $('roulette').innerHTML = items.map(p => `<div class="prize"><div class="prize-icon">${escapeHtml(p.icon||'🎁')}</div><div class="prize-name">${escapeHtml(p.name||'Подарок')}</div></div>`).join('');
  }
  function renderInventory(){
    const root=$('inventoryList');
    if(!state.inventory.length){root.innerHTML='<div class="empty">Пока подарков нет. Откройте кейс, чтобы получить первый!</div>';return;}
    root.innerHTML=state.inventory.map((g,i)=>`<article class="gift-row"><div class="gift-icon">${escapeHtml(g.icon||'🎁')}</div><div class="gift-info"><strong>${escapeHtml(g.name||'Подарок')}</strong><span>${escapeHtml(g.id ? 'ID: '+g.id : 'NFT-подарок')}</span></div><button class="withdraw" data-withdraw="${i}" type="button">Вывести в профиль</button></article>`).join('');
  }
  function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function showError(message){const el=$('notice');el.textContent=message;el.style.display='block';clearTimeout(showError.timer);showError.timer=setTimeout(()=>el.style.display='none',6500);}
  async function request(path, options={}){
    const headers={...(options.headers||{}),Authorization:auth()};
    if(options.body) headers['Content-Type']='application/json';
    const response=await fetch(API_BASE_URL+path,{...options,headers});
    const text=await response.text();let data={};try{data=text?JSON.parse(text):{};}catch(_){data={message:text};}
    if(!response.ok) throw new Error(data.error||data.message||`Ошибка сервера (${response.status})`);
    return data;
  }
  function applyUser(data){
    if(data.balance!==undefined){state.balance=Number(data.balance)||0;$('balance').textContent=String(state.balance);}
    const user=data.user||data;
    if(Array.isArray(data.inventory)) state.inventory=data.inventory;
    else if(Array.isArray(user.inventory)) state.inventory=user.inventory;
    renderInventory();
  }
  async function refreshBalance(){
    const button=$('refreshBalance');button.disabled=true;
    try{const data=await request('/api/user',{method:'GET'});applyUser(data);$('notice').style.display='none';}
    catch(err){showError(`Не удалось обновить баланс: ${err.message}`);}
    finally{button.disabled=false;}
  }
  async function openCase(caseId,button){
    if(state.busy)return;state.busy=true;button.disabled=true;
    try{
      const result=await request('/api/open-case',{method:'POST',body:JSON.stringify({case_id:caseId})});
      const prize=result.prize||result.gift||result.item||{};
      const prizes=Array.isArray(result.prizes)&&result.prizes.length?result.prizes:defaultPrizes;
      renderRoulette(prizes);
      const track=$('roulette'),wrap=$('roulette').parentElement;
      track.style.transition='none';track.style.transform='translateX(0px)';
      // Ставим выигрыш в позицию около центра после длинного, плавного прокрута.
      const chosen=Math.max(0,prizes.findIndex(p=>(p.id&&p.id===prize.id)||(p.name&&p.name===prize.name)));
      const targetIndex=prizes.length*2+chosen;
      const card=track.children[targetIndex];
      const offset=card ? card.offsetLeft + card.offsetWidth/2 - wrap.clientWidth/2 : 0;
      requestAnimationFrame(()=>{track.style.transition='transform 5.2s cubic-bezier(.08,.72,.12,1)';track.style.transform=`translateX(-${Math.max(0,offset)}px)`;});
      if(prize.name||prize.id){setTimeout(()=>{state.inventory.unshift(prize);renderInventory();},5300);}
      if(result.balance!==undefined){state.balance=Number(result.balance)||0;$('balance').textContent=String(state.balance);}
      $('notice').style.display='none';
    }catch(err){showError(`Не удалось открыть кейс: ${err.message}`);}
    finally{state.busy=false;button.disabled=false;}
  }
  async function withdraw(index,button){
    const gift=state.inventory[index];if(!gift)return;button.disabled=true;
    try{
      await request('/api/withdraw',{method:'POST',body:JSON.stringify({gift_id:gift.id, gift})});
      state.inventory.splice(index,1);renderInventory();
    }catch(err){showError(`Не удалось вывести подарок: ${err.message}`);button.disabled=false;}
  }
  renderCases();renderRoulette();renderInventory();
  if(tg){tg.ready();tg.expand();const u=tg.initDataUnsafe&&tg.initDataUnsafe.user;if(u){$('username').textContent=[u.first_name,u.last_name].filter(Boolean).join(' ')||u.username||'Пользователь';if(u.photo_url){$('avatar').textContent='';$('avatar').style.backgroundImage=`url("${String(u.photo_url).replace(/["\\]/g,'')}")`; $('avatar').style.backgroundSize='cover';}else $('avatar').textContent=($('username').textContent[0]||'?').toUpperCase();}}
  $('cases').addEventListener('click',e=>{const b=e.target.closest('[data-case]');if(b)openCase(b.dataset.case,b);});
  $('inventoryList').addEventListener('click',e=>{const b=e.target.closest('[data-withdraw]');if(b)withdraw(Number(b.dataset.withdraw),b);});
  $('casesTab').onclick=()=>{$('casesScreen').hidden=false;$('inventoryScreen').hidden=true;$('casesTab').classList.add('active');$('inventoryTab').classList.remove('active');};
  $('inventoryTab').onclick=()=>{$('casesScreen').hidden=true;$('inventoryScreen').hidden=false;$('inventoryTab').classList.add('active');$('casesTab').classList.remove('active');};
  $('topupBtn').onclick=()=>{$('topupModal').classList.add('show');};
  $('closeModal').onclick=()=>{$('topupModal').classList.remove('show');};
  $('topupModal').addEventListener('click',e=>{if(e.target===$('topupModal'))$('topupModal').classList.remove('show');});
  $('sendGift').href=STORAGE_URL;$('sendGift').onclick=e=>{e.preventDefault();if(tg&&typeof tg.openTelegramLink==='function')tg.openTelegramLink(STORAGE_URL);else window.open(STORAGE_URL,'_blank','noopener');};
  $('refreshBalance').onclick=refreshBalance;
  refreshBalance();
})();
</script>
</body>
</html>
